name: luraba

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3001
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-luraba_db}
  DB_USER: ${DB_USER:-luraba}
  DB_PASSWORD: ${DB_PASSWORD:-luraba}
  DB_SSL: "false"
  BASE_URL: ${BASE_URL:-http://localhost:${API_PORT:-3001}}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${WEB_PORT:-3000}}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-luraba_db}
      POSTGRES_USER: ${DB_USER:-luraba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luraba}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-luraba} -d ${DB_NAME:-luraba_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    restart: "no"
    env_file:
      - path: ./apps/api/.env
        required: true
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./apps/api/.env
        required: true
    environment: *api-environment
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:3001/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-3001}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:3000/login >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
