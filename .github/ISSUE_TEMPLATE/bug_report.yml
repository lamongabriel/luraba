name: Bug report
description: Report a reproducible problem in Luraba.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: List the smallest reproducible steps.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    attributes:
      label: Luraba version or commit
    validations:
      required: true
