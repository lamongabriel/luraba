name: Setup workspace
description: Install the root, API, and UI Node.js and pnpm dependencies independently.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: api/.nvmrc
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          api/pnpm-lock.yaml
          ui/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm --dir api install --frozen-lockfile
        pnpm --dir ui install --frozen-lockfile
