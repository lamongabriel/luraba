# Development compose - runs the API with hot-reload + a local Postgres instance
name: luraba-api-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-luraba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luraba}
      POSTGRES_DB: ${DB_NAME:-luraba_db}
    ports:
      - "${LURABA_DB_PORT:-29762}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-luraba} -d ${DB_NAME:-luraba_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: config/Dockerfile.api-dev
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-luraba_db}
      DB_USER: ${DB_USER:-luraba}
      DB_PASSWORD: ${DB_PASSWORD:-luraba}
      PORT: 8080
      BASE_URL: http://localhost:${LURABA_API_PORT:-22677}
      FRONTEND_ORIGIN: http://localhost:${LURABA_UI_PORT:-29670}
    ports:
      - "${LURABA_API_PORT:-22677}:8080"
    command: ["sh", "-c", "pnpm db:migrate && pnpm run dev"]
    volumes:
      - ./:/app
      - api_dev_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/opt/luraba/check-api.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_dev_data:
  api_dev_node_modules:
